name: VWAP Pullback Signal Check

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-vwap-pullback:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas scipy requests yfinance

      - name: Run VWAP pullback signal check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 vwap_pullback_0dte.py --live

      - name: Commit updated position state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain vwap_pullback_state.json 2>/dev/null)" ]; then
            git add vwap_pullback_state.json
            git commit -m "Update VWAP pullback position state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
