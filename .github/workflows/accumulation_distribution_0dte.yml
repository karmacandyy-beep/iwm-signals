name: IWM Accumulation/Distribution 0DTE Signal Check

on:
  # Every 5 minutes on weekdays; includes ET market hours in summer and winter.
  # GitHub may delay scheduled runs; the script gates entries by ET market hours.
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send one ntfy test notification before checking signals
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit state/ad_positions.json back to the repo

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas scipy requests yfinance

      - name: Send ntfy test notification
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          import requests
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit("NTFY_TOPIC is missing")
          try:
              response = requests.post(
                  f"https://ntfy.sh/{topic}",
                  data=b"Test notification: your IWM alert workflow is connected. Signal checks use yfinance on a five-minute weekday schedule; delivery may be delayed. This is not a trade signal.",
                  headers={"Title": "IWM notifications connected", "Tags": "white_check_mark"},
                  timeout=15,
              )
          except requests.RequestException:
              raise SystemExit("ntfy request failed; topic omitted from logs")
          if not response.ok:
              raise SystemExit(f"ntfy rejected the notification: HTTP {response.status_code}")
          print("ntfy accepted the test notification")
          PY

      - name: Run accumulation/distribution 0DTE signal check (LIVE)
        # --live always uses yfinance; no market-data API keys are required.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 accumulation_distribution_0dte.py --live --iterations 1

      - name: Save open-position state back to repo
        run: |
          if [ -n "$(git status --porcelain state/ad_positions.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/ad_positions.json
            git commit -m "Update open position state [skip ci]"
            git push
          else
            echo "No change to position state."
          fi
