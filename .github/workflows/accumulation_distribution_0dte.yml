name: IWM Accumulation/Distribution 0DTE Signal Check

on:
  # Every 5 min, Mon-Fri, 13:35-20:05 UTC = 9:35am-4:05pm ET
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write  # needed to commit state/ad_positions.json back to the repo

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas scipy requests yfinance

      - name: Run accumulation/distribution 0DTE signal check (LIVE - real yfinance data)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 accumulation_distribution_0dte.py --live --iterations 1

      - name: Save open-position state back to repo
        run: |
          if [ -n "$(git status --porcelain state/ad_positions.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/ad_positions.json
            git commit -m "Update open position state [skip ci]"
            git push
          else
            echo "No change to position state."
          fi
