name: Fast Momentum - Separate Paper Alerts

on:
  schedule:
    # Recovery attempts queue behind the single active monitor.
    # UTC window covers standard/daylight time; runtime checks the exchange calendar.
    - cron: '17,47 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate/backtest, or run separate paper alerts
        type: choice
        options: [validate, check, paper]
        default: validate
      test_notification:
        description: Send one clearly labeled Fast Momentum ntfy test
        type: boolean
        default: false
      bar_minutes:
        description: Signal candle length (1-minute fast default; optional 3-minute)
        type: choice
        options: ['1', '3']
        default: '1'

permissions:
  contents: write

concurrency:
  group: fast-momentum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-fast-momentum.txt
      - name: Install independent dependencies
        run: pip install -r requirements-fast-momentum.txt
      - name: Test strategy safeguards
        run: python -m unittest discover -s tests -p 'test_fast_momentum.py' -v
      - name: Verify notification connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fast_momentum.py test-notification
      - name: Check current market data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
        run: |
          python -u - <<'PYCODE'
          import time
          import pandas as pd
          from fast_momentum import Config, ET, complete_bars, download_bars, session_bounds
          cfg = Config()
          for attempt in range(4):
              raw = download_bars(days=1)
              now = pd.Timestamp.now(tz='UTC')
              bars = complete_bars(raw, cfg, now)
              if bars.empty:
                  raise RuntimeError('No completed market bars')
              end = bars.index[-1] + pd.Timedelta(minutes=1)
              age = (now-end).total_seconds()
              print(f'Feed check: checked={now.isoformat()} bar_end={end.isoformat()} age_seconds={age:.1f} IWM={bars.Close.iloc[-1]:.2f}', flush=True)
              bounds = session_bounds(now.tz_convert(ET).date())
              if not bounds or not (bounds[0] <= now < bounds[1]):
                  print('Market closed: historical fetch passed; live freshness not verified')
                  break
              if 0 <= age <= cfg.max_signal_age_seconds:
                  print('PASS: current completed bar available within freshness limit')
                  break
              if attempt == 3:
                  raise RuntimeError('Feed too delayed for fast-momentum entries')
              time.sleep(20)
          PYCODE
      - name: Historical replay
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' }}
        env:
          BAR_MINUTES: ${{ inputs.bar_minutes }}
        run: python fast_momentum.py backtest --bar-minutes "$BAR_MINUTES" --output research/fast_momentum
      - name: Select New York session
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from fast_momentum import session_bounds
          now = datetime.now(ZoneInfo('America/New_York'))
          bounds = session_bounds(now.date())
          in_window = bool(bounds and bounds[0] - timedelta(minutes=15) <= now < bounds[1])
          requested = os.environ['EVENT_NAME'] != 'workflow_dispatch' or os.environ['REQUESTED_MODE'] == 'paper'
          run = requested and in_window
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run={str(run).lower()}\n")
          print(f"Separate fast-momentum session selected: {run}")
          PY
      - name: Poll separate paper strategy
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BAR_MINUTES: ${{ inputs.bar_minutes || '1' }}
        run: python -u fast_momentum.py paper --bar-minutes "$BAR_MINUTES" --duration-minutes 180 --poll-seconds 15
      - name: Preserve only fast-momentum state
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: |
          if [ -f state/fast_momentum.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f state/fast_momentum.json
            if ! git diff --cached --quiet; then
              git commit -m 'Persist separate fast-momentum paper state [skip ci]'
              for attempt in 1 2 3; do
                git pull --rebase origin main
                if git push origin HEAD:main; then exit 0; fi
              done
              exit 1
            fi
          fi
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-momentum-research-${{ github.run_id }}
          path: research/fast_momentum/
          if-no-files-found: ignore
          retention-days: 30
      - name: Add run summary
        if: always()
        run: |
          if [ -f research/fast_momentum/report.md ]; then
            cat research/fast_momentum/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Fast Momentum: separate implementation. No historical performance result was produced in this run. Actual option-quote data is not connected; notifications are paper setups only.' >> "$GITHUB_STEP_SUMMARY"
          fi
